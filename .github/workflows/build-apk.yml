name: Build DURRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract DURRA Android project
        run: unzip -o DURRA_ANDROID_READY.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build DURRA APK
        run: gradle -p DURRA_ANDROID_READY :app:assembleDebug

      - name: Upload DURRA APK
        uses: actions/upload-artifact@v4
        with:
          name: DURRA-APK
          path: DURRA_ANDROID_READY/app/build/outputs/apk/debug/app-debug.apk
